image:
  repository: ghcr.io/amitpatole/audel
  tag: "1.0.0rc1"
  pullPolicy: IfNotPresent

# Async jobs (/jobs) live in each pod's memory, so the default is ONE replica. Raise it only for
# sync grading behind a load balancer, or with tenant-affine routing for /jobs (see docs).
replicaCount: 1

# At least one auth source is required; the chart never generates or embeds a credential.
auth:
  existingSecret: ""        # Secret with key AUDEL_API_TOKEN (shared token, >= 32 chars)
  tokensSecret: ""          # Secret with key tokens.json (per-tenant SHA-256 hashes)
  jwt:
    jwksConfigMap: ""       # ConfigMap with key jwks.json
    issuer: ""
    audience: ""
  adminTenants: []          # tenants allowed to read /doctor and /metrics

tls:
  secretName: ""            # kubernetes.io/tls Secret (tls.crt, tls.key); add ca.crt for mTLS
  mutual: false

env:
  AUDEL_DELIVERY_SPEC: ""
  AUDEL_MAX_CONCURRENT_JOBS: "2"
  AUDEL_MAX_REQUEST_BYTES: "200000000"
  AUDEL_MAX_MEDIA_BYTES: "200000000"
  AUDEL_REQUEST_TIMEOUT_S: "600"
  AUDEL_ALLOW_URL_INGEST: "false"
  AUDEL_REST_ALLOW_UNDERSTAND: "false"
  AUDEL_EGRESS: "allow"
  AUDEL_LOG_LEVEL: "WARNING"

resources:
  requests: {cpu: "1", memory: 1Gi}
  limits: {cpu: "2", memory: 3Gi}

cacheSizeLimit: 2Gi

service:
  type: ClusterIP
  port: 8000
  allowPlaintext: false   # LoadBalancer/NodePort without tls.secretName fails unless set

networkPolicy:
  enabled: true
  # Default: egress denied except DNS to kube-dns. Add CIDRs for an on-prem LLM or object store.
  egressCIDRs: []
  # Callers allowed in. Empty = pods in this namespace only (never "everyone").
  ingressFrom: []
  dnsNamespace: kube-system
  dnsPodLabels: {k8s-app: kube-dns}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
