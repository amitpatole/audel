apiVersion: v1
kind: Service
metadata:
  name: {{ include "audel.fullname" . }}
  labels: {{- include "audel.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "audel.selector" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
