name: OG images

on:
  push:
    branches: [main]
    paths:
      - "brand/social_*.html"
      - "brand/render_og.py"
      - ".github/workflows/og.yml"
  workflow_dispatch:

permissions:
  contents: read   # the commit job alone gets write

concurrency:
  group: og-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    # Runs third-party code (playwright, chromium) with a READ-ONLY token and hands the images
    # over as an artifact. Nothing it does can reach the write token.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install "playwright==1.64.0"
      - run: python -m playwright install --with-deps chromium
      - run: python brand/render_og.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: og-images
          path: brand/og-*.png

  commit:
    # Write token, but runs NO third-party code: download the PNGs, commit with hooks disabled.
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: og-images
          path: brand
      - name: Commit rendered OG images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null add brand/og-*.png
          if git diff --cached --quiet; then
            echo "no OG image changes"
          else
            # GITHUB_TOKEN pushes don't retrigger workflows; [skip ci] is belt-and-suspenders
            git -c core.hooksPath=/dev/null commit -m "Render OG card images [skip ci]"
            git -c core.hooksPath=/dev/null push
          fi
