name: OG images

on:
  push:
    branches: [main]
    paths:
      - "brand/social_*.html"
      - "brand/render_og.py"
      - ".github/workflows/og.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: og-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # no write token on disk while third-party code runs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install "playwright==1.64.0"
      - run: python -m playwright install --with-deps chromium
      - run: python brand/render_og.py
      - name: Commit rendered OG images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # only this final step sees the token
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand/og-*.png
          if git diff --cached --quiet; then
            echo "no OG image changes"
          else
            # GITHUB_TOKEN pushes don't retrigger workflows; [skip ci] is belt-and-suspenders
            git commit -m "Render OG card images [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
          fi
