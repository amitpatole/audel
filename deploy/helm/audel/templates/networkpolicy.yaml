{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "audel.fullname" . }}
  labels: {{- include "audel.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "audel.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{port: 8000, protocol: TCP}]
      {{- if .Values.networkPolicy.ingressFrom }}
      from: {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      {{- else }}
      from: [{podSelector: {}}]   # same namespace only
      {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}}
          podSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.dnsPodLabels | nindent 14 }}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    {{- range .Values.networkPolicy.egressCIDRs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
    {{- end }}
{{- end }}
