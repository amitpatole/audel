name: Publish

# Tag-triggered release: build once, publish to TestPyPI, then PyPI — via OIDC Trusted Publishing
# (no long-lived API tokens stored as secrets). Configure the trusted publisher for `audel` on both
# indexes first (PyPI/TestPyPI → project → Publishing → add this repo + workflow `publish.yml`).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read   # tightened per-job; publish jobs add id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.published.outputs.yes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*
      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#v}"
          got="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$want" = "$got" || { echo "tag $TAG != pyproject $got"; exit 1; }
      - name: Already on PyPI?
        id: published
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # A release uploaded by hand (before Trusted Publishing was set up) is not re-published.
          if curl -fsS "https://pypi.org/pypi/audel/${TAG#v}/json" >/dev/null; then
            echo "yes=true" >> "$GITHUB_OUTPUT"; echo "already on PyPI: publish jobs skipped"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: needs.build.outputs.published != 'true'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # OIDC: mint a short-lived token for this run only
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true   # a release first uploaded by hand isn't a failed run

  # The service image the Helm chart runs (ghcr.io/amitpatole/audel:<version>). Plain docker
  # commands: no third-party actions to pin. Smoke-tested before it is pushed.
  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: docker build -t "ghcr.io/amitpatole/audel:${TAG#v}" .
      - name: Smoke (refuses to start without a token; serves with one)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          img="ghcr.io/amitpatole/audel:${TAG#v}"
          if timeout 60 docker run --rm "$img"; then echo "started without auth"; exit 1; fi
          tok="$(docker run --rm --entrypoint audel "$img" token new | tail -1)"
          docker run -d --name smoke --read-only --tmpfs /tmp -e AUDEL_API_TOKEN="$tok" \
            -p 127.0.0.1:8000:8000 "$img"
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/healthz | grep -q '"status":"ok"'
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/check)"
          test "$code" = "401"
          docker rm -f smoke
      - name: Push
        env:
          TAG: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${TAG#v}"
          img="ghcr.io/amitpatole/audel"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$img:$v"
          case "$v" in *[a-z]*) ;; *)  # a final release (no rc / a / b) is also :latest
            docker tag "$img:$v" "$img:latest" && docker push "$img:latest" ;; esac
          docker logout ghcr.io
