{{- if not (or .Values.auth.existingSecret .Values.auth.tokensSecret .Values.auth.jwt.jwksConfigMap) }}
{{- fail "an auth source is required (auth.existingSecret, auth.tokensSecret or auth.jwt.jwksConfigMap): Audel refuses to serve a routable interface without auth" }}
{{- end }}
{{- if and .Values.auth.jwt.jwksConfigMap (not (and .Values.auth.jwt.issuer .Values.auth.jwt.audience)) }}
{{- fail "auth.jwt.issuer and auth.jwt.audience are required with a JWKS" }}
{{- end }}
{{- $mutual := lower (toString .Values.tls.mutual) }}
{{- $plain := lower (toString .Values.service.allowPlaintext) }}
{{- if not (has $mutual (list "true" "false")) }}
{{- fail "tls.mutual must be true or false" }}
{{- end }}
{{- if not (has $plain (list "true" "false")) }}
{{- fail "service.allowPlaintext must be true or false" }}
{{- end }}
{{- if and (eq $mutual "true") (not .Values.tls.secretName) }}
{{- fail "tls.mutual needs tls.secretName (a server certificate); refusing to render a plaintext deployment" }}
{{- end }}
{{- if and (has .Values.service.type (list "LoadBalancer" "NodePort")) (not .Values.tls.secretName) (ne $plain "true") }}
{{- fail "service.type exposes Audel outside the cluster without TLS: set tls.secretName (or service.allowPlaintext=true behind your own TLS)" }}
{{- end }}
{{- $scheme := ternary "HTTPS" "HTTP" (ne .Values.tls.secretName "") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "audel.fullname" . }}
  labels: {{- include "audel.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "audel.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "audel.selector" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: audel
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--host", "0.0.0.0", "--port", "8000"]
          ports:
            - {name: http, containerPort: 8000}
          env:
            {{- range $k, $v := .Values.env }}
            - {name: {{ $k }}, value: {{ $v | quote }}}
            {{- end }}
            {{- if .Values.auth.existingSecret }}
            - name: AUDEL_API_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.auth.existingSecret }}, key: AUDEL_API_TOKEN}
            {{- end }}
            {{- if .Values.auth.tokensSecret }}
            - {name: AUDEL_API_TOKENS_FILE, value: /etc/audel/auth/tokens.json}
            {{- end }}
            {{- if .Values.auth.jwt.jwksConfigMap }}
            - {name: AUDEL_JWT_JWKS_FILE, value: /etc/audel/jwks/jwks.json}
            - {name: AUDEL_JWT_ISSUER, value: {{ .Values.auth.jwt.issuer | quote }}}
            - {name: AUDEL_JWT_AUDIENCE, value: {{ .Values.auth.jwt.audience | quote }}}
            {{- end }}
            {{- with .Values.forwardedAllowIps }}
            - {name: AUDEL_FORWARDED_ALLOW_IPS, value: {{ toJson . | quote }}}
            {{- end }}
            {{- with .Values.auth.adminTenants }}
            - {name: AUDEL_ADMIN_TENANTS, value: {{ toJson . | quote }}}
            {{- end }}
            {{- if .Values.tls.secretName }}
            - {name: AUDEL_TLS_CERTFILE, value: /etc/audel/tls/tls.crt}
            - {name: AUDEL_TLS_KEYFILE, value: /etc/audel/tls/tls.key}
            {{- if eq $mutual "true" }}
            - {name: AUDEL_TLS_CLIENT_CA, value: /etc/audel/tls/ca.crt}
            {{- end }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          {{- if eq $mutual "true" }}
          # mTLS rejects probes without a client certificate: check the port instead.
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 30
          {{- else }}
          readinessProbe:
            httpGet: {path: /healthz, port: http, scheme: {{ $scheme }}}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http, scheme: {{ $scheme }}}
            periodSeconds: 30
            failureThreshold: 3
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: cache, mountPath: /var/cache/audel}
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.auth.tokensSecret }}
            - {name: tokens, mountPath: /etc/audel/auth, readOnly: true}
            {{- end }}
            {{- if .Values.auth.jwt.jwksConfigMap }}
            - {name: jwks, mountPath: /etc/audel/jwks, readOnly: true}
            {{- end }}
            {{- if .Values.tls.secretName }}
            - {name: tls, mountPath: /etc/audel/tls, readOnly: true}
            {{- end }}
      volumes:
        - name: cache
          emptyDir: {sizeLimit: {{ .Values.cacheSizeLimit }}}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
        {{- if .Values.auth.tokensSecret }}
        - name: tokens
          secret: {secretName: {{ .Values.auth.tokensSecret }}, defaultMode: 0400}
        {{- end }}
        {{- if .Values.auth.jwt.jwksConfigMap }}
        - name: jwks
          configMap: {name: {{ .Values.auth.jwt.jwksConfigMap }}}
        {{- end }}
        {{- if .Values.tls.secretName }}
        - name: tls
          secret: {secretName: {{ .Values.tls.secretName }}, defaultMode: 0400}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
